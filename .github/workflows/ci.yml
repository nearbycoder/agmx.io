name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agmx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/*.test.ts drop and re-migrate this database on every run.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agmx_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  sdk:
    name: SDK types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm ci --no-audit --no-fund
      - name: Check SDK types match the API
        run: |
          bun run sdk:types
          if ! git diff --exit-code -- packages/sdk/openapi.json packages/sdk/src/schema.ts; then
            echo "::error::packages/sdk is out of date with the API. Run 'bun run sdk:types' and commit the result."
            exit 1
          fi
      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build
      - name: Check CLI and Python package syntax
        run: |
          node --check packages/cli/bin/agmx.js
          python3 -m py_compile packages/python/agmx/__init__.py
